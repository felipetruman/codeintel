name: Review context check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-context:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Offline review collector tests
        run: |
          python3 -m unittest discover -s integrations/review/tests -v
          python3 -m compileall -q integrations/review
