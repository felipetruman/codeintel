name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust and benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
          python -m pip install 'PyYAML>=6.0,<7.0' 'pytest>=8.0,<9.0'
      - name: Rust gates
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --release --locked
      - name: Offline benchmark tests
        run: |
          unset CODEINTEL_BENCH_REAL_AGENTS
          PYTHONPATH="$PWD" python -m pytest benchmarks/agent/tests -q -o addopts=''
          python -m compileall -q benchmarks
      - name: Deterministic matrix
        run: |
          unset CODEINTEL_BENCH_REAL_AGENTS
          PYTHONPATH="$PWD" python -m benchmarks.agent.full_matrix \
            --corpus synthetic --runner rg --runner codeintel --repeat 2 \
            --codeintel-binary "$PWD/target/release/codeintel" \
            --output "$RUNNER_TEMP/codeintel-results"
          git diff --check
          test -z "$(git status --porcelain)"
