[package]
name = "codeintel"
version = "0.1.0"
edition = "2024"
description = "Local code intelligence and retrieval engine for agentic coding tools"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
